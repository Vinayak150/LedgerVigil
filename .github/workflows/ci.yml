name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.14"}
      - name: Scan tracked files
        run: python -m tools.secret_scan
      - name: Scan every commit in history for forbidden files
        run: |
          bad=$(git log --all --name-only --pretty=format: | sort -u | grep -E '(^|/)(\.env(\..*)?|.*\.pem|.*\.key|.*\.dump|.*\.sqlite3?|.*\.backup)$' | grep -v '^deploy/env/.*\.example$' || true)
          if [ -n "$bad" ]; then echo "forbidden files in history:"; echo "$bad"; exit 1; fi

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-disposable-superuser   # secret-scan: allow (disposable CI service)
          POSTGRES_DB: ledgervigil_dev
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7.4-alpine
        ports: ["56379:6379"]
    env:
      POSTGRES_PASSWORD: ci-disposable-superuser   # secret-scan: allow
      LV_TEST_REDIS_URL: redis://127.0.0.1:56379/0
      LV_PG_CLIENT: local
      LV_PG_BIN: /usr/lib/postgresql/18/bin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.14"}
      - name: PostgreSQL 18 client tools (recovery drills run pg_dump/pg_restore of the same major version)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update && sudo apt-get install -y postgresql-client-18
      - name: Install pinned dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --no-deps -r requirements.lock -r worker-requirements.lock
          .venv/bin/python -m pip install --no-deps -e .
          .venv/bin/python -m pip check
      - name: Prepare disposable database roles
        run: PATH=.venv/bin:$PATH sh scripts/ci_prepare.sh
      - name: Public index (optional artifact)
        if: ${{ vars.LV_PUBLIC_INDEX_URL != '' }}
        run: |
          mkdir -p "$RUNNER_TEMP/public-index"
          curl -fsSL "${{ vars.LV_PUBLIC_INDEX_URL }}" | tar -xz -C "$RUNNER_TEMP/public-index"
          echo "LV_PUBLIC_INDEX=$RUNNER_TEMP/public-index/index-v1" >> "$GITHUB_ENV"
      - name: Backend suite (serial; tests share one PostgreSQL server)
        run: |
          deselect=""
          if [ -z "${LV_PUBLIC_INDEX:-}" ]; then deselect="--deselect tests/test_plan_inspection.py"; echo "::warning::public index artifact not provided: tests/test_plan_inspection.py NOT RUN"; fi
          PYTHONPATH=src:.:tests .venv/bin/python -m pytest -q -p no:cacheprovider -rfEs $deselect --junitxml=backend-junit.xml tests
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: backend-junit, path: backend-junit.xml}
      - name: Dependency audit (known vulnerabilities in pinned Python packages)
        run: |
          .venv/bin/python -m pip install pip-audit==2.9.0
          .venv/bin/pip-audit --strict -r requirements.lock -r worker-requirements.lock

  frontend:
    runs-on: ubuntu-24.04
    defaults: {run: {working-directory: web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22.23.4", cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: node --test tests/*.test.mjs scripts/*.test.mjs
      - name: Contract and generated-type parity
        run: node scripts/check-api.mjs
      - name: Delivered-source manifest
        run: python3 scripts/verify-delivery.py
      - name: Formatting (files owned by the frontend)
        run: npx prettier --check src tests scripts/check-api.mjs next.config.ts
      - name: Production build
        run: npx next build
      - name: Dependency audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
